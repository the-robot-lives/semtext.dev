# semtext.dev — web/ Next.js static export at /, plus legacy 301s.
#
# Layout (see Dockerfile): the export is the web root; /semtext/, /demo/ and
# /spec/ are static asset trees from web/public/; every page is <dir>/index.html
# (trailingSlash export).
#
# NOTE ON add_header: nginx does not inherit add_header directives into a
# location that declares its own. Every location that sets any header therefore
# repeats the full security-header set, rather than relying on server-level
# inheritance that silently would not apply.
#
# NOTE ON legacy URLs: the pre-web image served landing/ at / and the vite
# showcase (dist/site, dist/demo pages, dist/spec sources, root semtext*.js
# bundles, /themes/*.css). Those builds left the image; their URLs redirect:
#
#   /site/…                       → /showcase/   (new showcase section)
#   /demo/, /demo/<old>.html      → /showcase/   (fixtures keep their paths)
#   /semtext.js, -fallback.js     → /semtext/…   (bundle home moved)
#   /semtext-reading.js           → /dataviz/semtext-reading.js
#   /themes/<name>.css            → /semtext/themes/<name>.css (old set is a
#                                   strict subset of the new)
#   /spec/, /spec/conventions.*   → /spec/semtext.html (new spec snapshot)
#   /spec/extraction.md           → /docs/
#   /spec/schema/<name>.md        → /spec/schema/<name>.sem.html (rendered
#                                   fixture; every old .md has one)
#   /semtext-extract.js, /semtext-md.js: no successor (runtime bundles of the
#   removed vite demos) → honest 404.
#
# Redirect locations MUST be declared before the cache regexes below: regex
# locations are evaluated in order of appearance, and e.g. /demo/md-only.html
# also matches the unhashed-asset cache rule.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html index.sem.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xhtml+xml text/xml image/svg+xml;
    gzip_min_length 256;

    # A real 404 page (the export ships /404.html) instead of the old SPA
    # fallback that served the home shell for every unknown path.
    error_page 404 /404.html;

    # Liveness/readiness probe target (no access logging noise). CONTRACT:
    # the helm chart probes this exact path — do not rename.
    location /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- legacy redirects (see header note) -------------------------------

    # Old root bundles → new bundle home; the reading runtime lives under
    # /dataviz/ now.
    location = /semtext.js          { return 301 /semtext/semtext.js; }
    location = /semtext-fallback.js { return 301 /semtext/semtext-fallback.js; }
    location = /semtext-reading.js  { return 301 /dataviz/semtext-reading.js; }

    # Old showcase marketing page → new showcase section.
    location = /site            { return 301 /showcase/; }
    location = /site/           { return 301 /showcase/; }
    location = /site/index.html { return 301 /showcase/; }

    # Old vite demo pages → new showcase. /demo/<fixture>.sem.html and the
    # other public/demo files fall through untouched.
    location = /demo/           { return 301 /showcase/; }
    location = /demo/index.html { return 301 /showcase/; }
    # The regex MUST stay quoted: nginx reads a bare `{` in a location regex
    # as the start of a block, so an unquoted alternation breaks the parse.
    location ~* "^/demo/(md-only|reading|reading-lit|standalone-lit)\.html$" {
        return 301 /showcase/;
    }

    # Old spec sources → new spec snapshot / docs; raw schema .md → fixture.
    location = /spec/                 { return 301 /spec/semtext.html; }
    location = /spec/conventions.html { return 301 /spec/semtext.html; }
    location = /spec/conventions.md   { return 301 /spec/semtext.html; }
    location = /spec/extraction.md    { return 301 /docs/; }
    location ~* "^/spec/schema/(?<schemadoc>.+)\.md$" {
        return 301 /spec/schema/$schemadoc.sem.html;
    }

    # Old root theme CSS → new theme home (superset incl. the landing theme).
    location ~* "^/themes/(?<themecss>.+\.css)$" {
        return 301 /semtext/themes/$themecss;
    }

    # The /elements/ glossary moved to /reference/; the export also ships a
    # meta-refresh page at that path as a fallback for non-nginx servers.
    location = /elements/ { return 301 /reference/; }

    # ---- cache policy ------------------------------------------------------

    # Next.js static export assets — content-hashed, safe to cache forever.
    # ^~ is REQUIRED: regex locations are evaluated before a plain prefix
    # match, and export chunk names hash on a dash (webpack-e1ae…f7355.js),
    # so the hashed/unhashed rules below would otherwise shadow this one.
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fingerprinted static assets — safe to cache forever.
    location ~* "\.[0-9a-f]{8,}\.(css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Un-fingerprinted static assets (bundles, theme CSS, images) — cache for
    # a day, revalidate after.
    location ~* "\.(css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$" {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # HTML and the rest: never long-cached — that is how a new deploy reaches
    # a browser. Unknown paths are a genuine 404 (404.html body), not the
    # home shell.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
