# semtext.dev — static site + demos.
#
# NOTE ON add_header: nginx does not inherit add_header directives into a
# location that declares its own. Every location that sets any header therefore
# repeats the full security-header set, rather than relying on server-level
# inheritance that silently would not apply.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xhtml+xml text/xml image/svg+xml;
    gzip_min_length 256;

    # Liveness/readiness probe target (no access logging noise).
    location /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted static assets — safe to cache forever.
    # The regex MUST stay quoted: nginx reads a bare `{` in a location regex as
    # the start of a block, so an unquoted `{8,}` is a config parse error.
    location ~* "\.[0-9a-f]{8,}\.(css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Un-fingerprinted static assets — cache for a day, revalidate after.
    location ~* "\.(css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$" {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # HTML is never long-cached: it is how a new deploy reaches a browser.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
