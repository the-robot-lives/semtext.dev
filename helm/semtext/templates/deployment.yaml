apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semtext.fullname" . }}
  labels:
    {{- include "semtext.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "semtext.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "semtext.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: frontend
        image: {{ .Values.frontend.image }}
        imagePullPolicy: Always
        env:
        - name: GA_MEASUREMENT_ID
          value: {{ .Values.gaMeasurementId | default "" | quote }}
        ports:
        - containerPort: {{ .Values.frontend.port }}
          protocol: TCP
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /nginx-health
            port: {{ .Values.frontend.port }}
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /nginx-health
            port: {{ .Values.frontend.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always
