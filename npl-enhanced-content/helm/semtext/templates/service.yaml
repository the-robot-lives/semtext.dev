apiVersion: v1
kind: Service
metadata:
  name: {{ include "semtext.fullname" . }}
  labels:
    {{- include "semtext.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: frontend
    port: {{ .Values.frontend.port }}
    targetPort: {{ .Values.frontend.port }}
    protocol: TCP
  selector:
    {{- include "semtext.selectorLabels" . | nindent 4 }}
