{{- if .Values.devSlot.enabled }}
{{- $slot := .Values.devSlot }}
# 1) Git deploy key — synced from Infisical /apps/semtext, scoped to the ONE
#    key via template.includeAllSecrets=false + explicit data mapping, so the
#    dev pod's secret NEVER contains the prod app secrets that share the path
#    (DATABASE_URL etc). Read-only GitHub deploy key for the-robot-lives/semtext.dev.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "hologram-start-app.fullname" . }}-live-dev-git
  labels:
    {{- include "hologram-start-app.labels" . | nindent 4 }}
    semtext.dev/slot: live-dev
spec:
  hostAPI: {{ .Values.secrets.infisical.hostAPI }}
  resyncInterval: 300
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ .Values.secrets.infisical.credentialsSecret }}
        secretNamespace: {{ .Values.secrets.infisical.credentialsNamespace }}
      secretsScope:
        projectSlug: {{ .Values.secrets.infisical.projectSlug }}
        envSlug: {{ .Values.secrets.infisical.envSlug }}
        secretsPath: {{ .Values.secrets.infisical.secretsPath | quote }}
  managedSecretReference:
    secretName: {{ $slot.gitSecret.name }}
    secretNamespace: {{ .Release.Namespace }}
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        {{ $slot.gitSecret.key }}: "{{`{{ .`}}{{ $slot.gitSecret.key }}{{`.Value }}`}}"
---
# 2) TLS for dev.semtext.dev — own secret (creationPolicy Owner) rendered from
#    the SAME Infisical path as the prod cert. The origin cert's SANs cover
#    semtext.dev + *.semtext.dev, and a separate secret name means the two
#    Owner-syncs never fight (cdn-semtext-tls precedent).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "hologram-start-app.fullname" . }}-live-dev-tls
  labels:
    {{- include "hologram-start-app.labels" . | nindent 4 }}
    semtext.dev/slot: live-dev
spec:
  hostAPI: {{ .Values.tls.infisical.hostAPI }}
  resyncInterval: {{ .Values.tls.infisical.resyncInterval }}
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ .Values.tls.infisical.credentialsSecret }}
        secretNamespace: {{ .Values.tls.infisical.credentialsNamespace }}
      secretsScope:
        projectSlug: {{ .Values.tls.infisical.projectSlug }}
        envSlug: {{ .Values.tls.infisical.envSlug }}
        secretsPath: {{ .Values.tls.infisical.secretsPath | quote }}
  managedSecretReference:
    secretName: {{ $slot.tls.secretName }}
    secretNamespace: {{ .Release.Namespace }}
    secretType: kubernetes.io/tls
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        tls.crt: "{{`{{ .`}}{{ .Values.tls.infisical.crtKey }}{{`.Value }}`}}"
        tls.key: "{{`{{ .`}}{{ .Values.tls.infisical.keyKey }}{{`.Value }}`}}"
{{- end }}
