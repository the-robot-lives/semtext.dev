replicas: 1
domain: semtext.dev
appDomain: proposals.semtext.dev
# appDomain is the proposals host (design v2 §3.1): both hosts dispatch into
# the same backend via SemtextWeb.Plugs.HostDispatch. Cookies stay HOST-ONLY
# (no Domain= attribute) per design §3.1 — a parent-zone cookie would leak to
# every sibling subdomain including the future play. sandbox origin.
cookieDomain: ""

# Render the prod stack (Deployment/Service/migrate Job) from this release.
# The live-dev slot release (values-live-dev.yaml) flips this off so the two
# releases never fight over names, hosts, or synced secrets.
backend:
  enabled: true
  image: ops.noizu.com/semtext.dev/app:sha-e89026f
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Frontend is served by the Phoenix+Hologram backend (no separate Next.js
# container/image). The `frontend` stanza below exists only because
# service.yaml/ingress.yaml unconditionally reference `.Values.frontend.port`
# for a second named Service port -- it points at the same single backend
# process/port, not a second container. No `image` key: nothing in this
# chart's templates consumes `.Values.frontend.image`.
frontend:
  port: 4000

migrate:
  enabled: true
  command: ["bin/semtext", "eval", "Semtext.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

database:
  host: app-timescaledb.apps.svc.cluster.local
  port: 5432
  name: semtext_prod

# Reference only: REDIS_URL arrives via the synced secret (platform-valkey
# default user, db 6 — 0-5 are taken by sibling apps). This stanza feeds no
# template; kept so operators can see the target at a glance.
redis:
  host: platform-valkey.platform.svc.cluster.local
  port: 6379
  db: 6

fleetIngest:
  # Fleet dashboard ingest endpoint for the daily FleetPush push.
  url: "https://fleet.noizu.com/api/v1/ingest/metrics"

# Synced by the chart-managed InfisicalSecret below from Infisical path
# /apps/semtext (store keys are the env names: DATABASE_URL, SECRET_KEY_BASE,
# SESSION_SIGNING_SALT, GUARDIAN_SECRET_KEY, REDIS_URL, SEMTEXT_DB_*).
secrets:
  name: semtext-secrets
  infisical:
    enabled: true
    resyncInterval: 120
    hostAPI: https://infisical.noizu.com/api
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/semtext"
  keys:
    dbUser: SEMTEXT_DB_USER
    dbPassword: SEMTEXT_DB_PASSWORD
    databaseUrl: DATABASE_URL
    secretKeyBase: SECRET_KEY_BASE
    sessionSigningSalt: SESSION_SIGNING_SALT
    guardianSecretKey: GUARDIAN_SECRET_KEY
    redisUrl: REDIS_URL
    # Fleet dashboard (fleet.noizu.com) daily ingest bearer key. Optional
    # secretKeyRef in _helpers.tpl: until it lands in the synced secret the
    # pod boots without it and FleetPush no-ops (logs once).
    fleetIngestKey: SEMTEXT_FLEET_INGEST_KEY
    # Live-fetch proxy (agent-kit lookups, PR #127). Optional secretKeyRef in
    # _helpers.tpl: until these land in the synced secret the pod boots
    # without them and the proxy routes fail soft with 503 not_configured.
    agentKitApiUrl: AGENT_KIT_API_URL
    agentKitApiKey: AGENT_KIT_API_KEY
    # Not provisioned yet — empty disables the env (the {{- if gates in
    # _helpers.tpl). Flip these on (and set the /apps/semtext store keys)
    # when the user creates the OAuth App / GitHub App / Turnstile account.
    sendgridApiKey: ""
    oidcClientId: ""
    oidcClientSecret: ""
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""

mail:
  fromName: ""
  fromAddress: ""

sso:
  requireInvite: false
  # SSO availability by email domain. Format:
  # "example.com=oidc;corp.example=google,oidc"
  domains: ""
  # Domains whose SSO registrations are approved immediately. All other SSO
  # registrations remain pending unless an invite activates them. Format:
  # "example.com;corp.example" or "*" for every SSO-enabled domain.
  autoApproveDomains: "*"
  oidc:
    # Default OIDC issuer for portfolio services (Authentik at auth.derobot.is)
    # Example: https://auth.derobot.is/application/o/{app-slug}/
    issuer: ""
  saml:
    # Samly 1.4 expects raw metadata XML or a local metadata file path; it does
    # not fetch metadata URLs at runtime.
    idpMetadata: ""
    idpMetadataFile: ""
    # Deprecated. Kept for existing values files that used this as a file path.
    idpMetadataUrl: ""
    spEntityId: ""

extraEnv: []

configMap:
  enabled: false
  data: {}

imagePullSecrets:
  - name: ops-registry-secret

analytics:
  ga:
    measurementId: ""
  posthog:
    key: ""
    host: "https://us.i.posthog.com"

ingress:
  # Extra hosts routed identically to `domain` (TLS included). www was
  # served by the pre-replatform static chart — parity requires it.
  extraHosts:
    - www.semtext.dev
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true

tls:
  enabled: true
  secretName: semtext-dev-tls
  infisical:
    enabled: true
    resyncInterval: 300
    hostAPI: https://infisical.noizu.com/api
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tls/semtext"
    crtKey: SEMTEXT_TLS_CRT
    keyKey: SEMTEXT_TLS_KEY

# OpenTelemetry → SigNoz wiring (conventions: trl-infra docs/observability/
# OTEL-CONVENTIONS.md). enabled=false ships NO OTEL_* env vars at all, so the
# runtime no-ops (SDK disabled, zero connection attempts).
otel:
  enabled: true
  # The fleet site key — MUST equal the site's entry in the fleet repo's
  # app/priv/sites.yml (generated from docs/site-fleet/REGISTRY.md); SigNoz
  # deep-links key off it exactly (https://apm.noizu.com/services/<key>).
  # "semtext" is this scaffold's template placeholder.
  fleetSiteKey: "semtext"
  collectorEndpoint: "http://signoz-otel-collector.infra.svc:4318"
  protocol: "http/protobuf"
  sampler: "parentbased_traceidratio"
  samplerArg: "1.0"
  serviceNamespace: "portfolio"
  # deployment.environment: prod | stage | dev per conventions; empty falls
  # back to the release namespace.
  deploymentEnvironment: ""
  # service.version: deployed image sha/tag; empty falls back to the tag part
  # of backend.image.
  serviceVersion: ""

storage:
  enabled: false
  bucket: ""
  region: "us-east-1"
  endpoint: ""
  scheme: "https://"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

sandbox:
  enabled: false
  image: ops.noizu.com/semtext/sandbox:latest
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  service:
    type: ClusterIP

# ---------------------------------------------------------------------------
# Live dev slot (dev.semtext.dev) — opt-in SECOND environment from this chart.
# The dev-slot deployment clones origin/develop at runtime (read-only GitHub
# deploy key) and redeploys on every new commit; the server runs Phoenix DEV
# mode (CodeReloader + LiveReloader = remote code execution by design), so
# the ingress is ALWAYS behind the house Authentik forward-auth gate — no
# anonymous request ever reaches Phoenix.
#
# Isolation guarantees (LIVE_DEV pattern):
#   * own throwaway Postgres + Redis as same-pod sidecars (localhost only);
#     NEVER the cluster DB, never platform-valkey
#   * only secret mounted in the pod is the git deploy key, synced by its own
#     InfisicalSecret from /apps/semtext (key SEMTEXT_LIVE_DEV_DEPLOY_KEY)
#   * signing secrets are generated at first boot into the workspace volume
# Enable via values-live-dev.yaml (release semtext-live-dev, ArgoCD app
# semtext-live-dev); the prod release keeps this false and renders nothing.
devSlot:
  enabled: false
  host: dev.semtext.dev
  # Toolchain image (Dockerfile.live-dev) — code comes from git, so the
  # mutable :live-dev tag + Always pull is correct here (NOT for prod).
  image: ops.noizu.com/semtext.dev/app:sha-e89026f
  branch: develop
  pollSeconds: 30
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  postgres:
    # pgvector image: the Liquibase changelog creates vector/cube/
    # earthdistance/pg_trgm/citext extensions (same image as app-ci.yml).
    image: pgvector/pgvector:pg17
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  redis:
    image: redis:7-alpine
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  workspace:
    # Git clone + deps/_build cache — survives pod restarts so a rebuild is
    # incremental. Throwaway data only.
    size: 8Gi
    storageClass: ""
  gitSecret:
    # Synced by templates/dev-secrets.yaml from Infisical /apps/semtext.
    name: semtext-live-dev-git
    key: SEMTEXT_LIVE_DEV_DEPLOY_KEY
  tls:
    # Own secret (creationPolicy Owner) from the SAME Infisical path as the
    # prod cert — the origin cert covers semtext.dev + *.semtext.dev, so the
    # two Owner-secrets never fight over the same name (cdn-semtext-tls
    # precedent).
    secretName: semtext-live-dev-tls
  # Manual-deploy proxy outpost (authentik's supported unmanaged mode). The
  # worker's Local-Kubernetes integration cannot create objects in this
  # cluster (both authentik pods run as SA `default`, no outpost RBAC), so
  # the slot ships its OWN outpost pod — see templates/dev-outpost.yaml.
  # The token secret is created out-of-band (kubectl create secret; value is
  # re-mintable in seconds: POST /core/tokens/ + GET .../view_key/ as the
  # admin token). TODO: wire Infisical once we can create secrets via API
  # (this instance's v3 POST enforces client-side encryption).
  outpost:
    # MUST match the authentik SERVER version (goauthentik/server:2025.6.0).
    image: ghcr.io/goauthentik/proxy:2025.6.0
    tokenSecret:
      name: semtext-live-dev-outpost-token
      key: SEMTEXT_LIVE_DEV_OUTPOST_TOKEN
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  auth:
    # House Authentik gate via THIS slot's proxy outpost (in-namespace
    # service; see templates/dev-outpost.yaml). auth-url is resolved
    # in-cluster (no Cloudflare hop for every subrequest); auth-signin loops
    # back through the SAME ingress host, where the /outpost.goauthentik.io
    # path (own auth-free ingress) reaches the outpost pod.
    authUrl: "http://semtext-live-dev-live-dev-outpost.apps.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx"
    authSignin: "https://dev.semtext.dev/outpost.goauthentik.io/start?rd=$scheme://$host$escaped_request_uri"
