name: CI

# Consolidated semtext.dev repo: the SemText format (spec, src, site, demo,
# themes — the ex npl-enhanced-content showcase) + the Claude Code mod.
#
# Release path (see monorepo docs/arch/deployment.md):
#   The deployed Hologram app is built and bumped by app-ci.yml
#   (app/helm/semtext, ArgoCD path). The legacy Next.js `web` image pipeline
#   (test-landing / docker-build / build-push, IMAGE_REPO semtext.dev/web)
#   was retired 2026-11-11 together with the web/ tree and the root
#   Dockerfile/nginx.conf — this workflow no longer builds any image.
#   The earlier bump-chart job was retired 2026-10-17: it edited the dead
#   root helm/semtext chart (since deleted) and raced the real bump, leaving
#   ArgoCD on a revision that did not name the new image.
#
# Component bundles are additionally published to the cdn.semtext.dev bucket
# under an immutable /<version>/ prefix plus a mutable /latest/ pointer
# (publish-cdn is dormant until the CDN secrets/variable are carried over).

on:
  push:
    # develop pushes run the test jobs; they exist to seed develop-ref
    # caches that feature-PR runs can restore — a PR-ref cache is invisible
    # to sibling PRs.
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs only. A push to main must never be cancelled
  # mid publish-cdn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CDN_BUCKET: cdn-semtext-dev

permissions:
  contents: read

jobs:
  unit:
    # vitest unit tier — plain run in the PR/develop fast lane (~3.5s).
    # The coverage gate (threshold ratchet in vite.config.ts) runs nightly;
    # see docs/TEST-HEALTH.md.
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0 # no browser needed here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:unit

  mod:
    # Mod tier — `claude plugin test mods/semtext` runs the mod's *.test.ts(x)
    # as children of the Claude Code CLI: no model calls, no credentials
    # (verified 2026-11-11 on a clean HOME with the API-key env vars empty —
    # 73 pass, sub-second, no node_modules needed). The CLI is installed from
    # npm and pinned to the measured version; bump it together with
    # docs/TEST-HEALTH.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.322
      - run: claude plugin test mods/semtext

  # The cypress e2e tier is NOT in this lane. The PR/develop shards ran
  # through cypress-io/github-action@v6, which has been dying
  # "Socket closed before the connection was established" ~15ms into its
  # wait-on since 2026-10-20 — 101 consecutive failures, zero specs executed
  # (an action-plumbing failure, not a product regression). Full suite runs
  # nightly on the explicit steps introduced 2026-11-11 (no GH Action around
  # cypress anywhere); scripts/cypress-shard.mjs stays available to re-shard
  # by hand. Root cause + remediation: docs/TEST-HEALTH.md.

  publish-cdn:
    # Publish the component bundles + themes to cdn.semtext.dev.
    #   <version>/  immutable, never overwritten once published
    #   latest/     mutable pointer, short max-age so it can move
    #
    # Gated so the pipeline stays green before the CDN secrets exist in THIS
    # repo. Carried over verbatim from npl-enhanced-content, where the switch
    # (repository VARIABLE `CDN_PUBLISH`) was never set — the job is dormant.
    # To turn on, an operator must add CDN_MINIO_URL / CDN_MINIO_ACCESS_KEY /
    # CDN_MINIO_SECRET_KEY secrets and `gh variable set CDN_PUBLISH --body true`.
    #
    # Builds the bundles from the root npm build (independent of any image);
    # gated on unit only since the web-image build-push job was retired.
    needs: [unit]
    if: vars.CDN_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Same gate as the test job: published bundles meet their budgets.
      - run: npm run build:strict
      - name: Stage CDN payload
        id: payload
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          rm -rf cdn-payload
          mkdir -p cdn-payload/themes
          cp dist/semtext.js dist/semtext-reading.js dist/semtext-extract.js dist/semtext-md.js cdn-payload/
          cp themes/*.css cdn-payload/themes/
          find cdn-payload -type f | sort
      - name: Install mc
        run: |
          set -euo pipefail
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc --version
      - name: Publish
        env:
          CDN_MINIO_URL: ${{ secrets.CDN_MINIO_URL }}
          CDN_MINIO_ACCESS_KEY: ${{ secrets.CDN_MINIO_ACCESS_KEY }}
          CDN_MINIO_SECRET_KEY: ${{ secrets.CDN_MINIO_SECRET_KEY }}
          VERSION: ${{ steps.payload.outputs.version }}
        run: |
          set -euo pipefail
          mc alias set cdn "$CDN_MINIO_URL" "$CDN_MINIO_ACCESS_KEY" "$CDN_MINIO_SECRET_KEY"

          TARGET="cdn/${CDN_BUCKET}/${VERSION}"
          if [ -n "$(mc ls --quiet "$TARGET/" 2>/dev/null || true)" ]; then
            echo "::notice::${VERSION} already published — versioned prefix is immutable, skipping."
          else
            mc mirror --overwrite \
              --attr "Cache-Control=public,max-age=31536000,immutable" \
              cdn-payload/ "$TARGET/"
          fi